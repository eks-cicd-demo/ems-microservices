name: Continuous Integration

on:
  push:
    branches:
      - github-actions
  workflow_dispatch:
    
jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            gateway/requirements.txt
            auth-service/requirements.txt
            employee-service/requirements.txt
            admin-service/requirements.txt
            dashboard-service/requirements.txt
      - name: check python version 
        run: |
         python --version
         pip --version

      - name: upgrade pip
        run: |
          python -m pip install --upgrade pip

      - name: Install Gageway requirements
        run: pip install -r gateway/requirements.txt

      - name: Install Auth requirements
        run: pip install -r auth-service/requirements.txt

      - name: Install Employee requirements
        run: pip install -r employee-service/requirements.txt

      - name: Install Admin requirements
        run: pip install -r admin-service/requirements.txt

      - name: Install Dashboard requirements
        run: pip install -r dashboard-service/requirements.txt

      - name: CI Completed
        run: echo "All dependencies installed successfully!!"