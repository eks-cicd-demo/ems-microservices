name: Docker Build

on:
  workflow_run:
    workflows:
      - Run Tests
    types:
      - completed

permissions:
  contents: read

jobs:
  docker-build:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service:
          - gateway
          - auth-service
          - employee-service
          - admin-service
          - dashboard-service

    steps:
      - name: checkout repository
      - uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          docker build \
            -t ems-${{ matrix.service }}:${{ github.sha }} \
            ./${{ matrix.service }}

      - name: Verify Image
        run: |
          docker image inspect \
            ems-${{ matrix.service }}:${{ github.sha }}

      - name: List Images
        run: docker images